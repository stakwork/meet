services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    container_name: caddy.sphinx
    # command: caddy reverse-proxy --from https://$DOMAIN:443 --to http://livekit.sphinx:3000
    ports:
      - 80:80
      - 443:443
    volumes:
      - caddy:/data
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - livekit
    environment:
      - DOMAIN=$DOMAIN

  livekit:
    image: sphinxlightning/sphinx-livekit:latest
    restart: on-failure
    command: ['node', 'server.js']
    container_name: livekit.sphinx
    environment:
      - HOSTNAME=0.0.0.0
      # Secrets — provided at runtime, never baked into the image
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_KEY_ID=${S3_KEY_ID}
      - S3_KEY_SECRET=${S3_KEY_SECRET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - RUNNER_URL=${RUNNER_URL}
      - RUNNER_SECRET=${RUNNER_SECRET}
      # The agent a room this server creates dispatches (sphinx-voice's name; default jamie)
      - LIVEKIT_AGENT_NAME=${LIVEKIT_AGENT_NAME}
    ports:
      - 3000:3000

  voice:
    image: sphinxlightning/sphinx-voice:latest
    container_name: voice.sphinx
    restart: on-failure
    environment:
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - MCP_SERVERS=${MCP_SERVERS}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PRELIMINARY_FEATURE_INTENT=${PRELIMINARY_FEATURE_INTENT}
      - HIVE_MCP_URL=${HIVE_MCP_URL}
      - IGNORE_ROOM_PREFIX=${IGNORE_ROOM_PREFIX}
      - LIVEKIT_AGENT_NAME=${LIVEKIT_AGENT_NAME}
      # Jamie's key for Hive's call token exchange (Hive's VOICE_AGENT_API_KEY)
      - VOICE_AGENT_API_KEY=${VOICE_AGENT_API_KEY}
      # Wake-word follow-up timings; unset falls back to sphinx-voice's in-code defaults (3000 / 1500 ms)
      - WAKE_FOLLOW_UP_MS=${WAKE_FOLLOW_UP_MS}
      - WAKE_FOLLOW_UP_PAUSE_MS=${WAKE_FOLLOW_UP_PAUSE_MS}

volumes:
  caddy:
