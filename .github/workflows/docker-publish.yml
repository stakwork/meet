name: Publish Docker Image

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: sphinxlightning/sphinx-livekit

      # Only NEXT_PUBLIC_* vars are needed at build time — they get inlined into
      # the client bundle by Next.js. All secrets (LIVEKIT_API_KEY, LIVEKIT_API_SECRET,
      # S3_*, etc.) are provided at runtime via the orchestrator (see prod.yaml).
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            NEXT_PUBLIC_SHOW_SETTINGS_MENU=true
            NEXT_PUBLIC_LK_RECORD_ENDPOINT=/api/record
          tags: |
            sphinxlightning/sphinx-livekit:latest
            sphinxlightning/sphinx-livekit:${{ steps.vars.outputs.sha }}

      # Verify: gh attestation verify oci://index.docker.io/sphinxlightning/sphinx-livekit@sha256:<digest> --owner stakwork
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/sphinxlightning/sphinx-livekit
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
